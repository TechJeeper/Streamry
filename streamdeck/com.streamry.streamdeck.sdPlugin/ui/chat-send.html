<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Send Chat</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        color: #eee;
        margin: 12px;
        font-size: 13px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        opacity: 0.8;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        min-height: 72px;
        padding: 6px 8px;
      }
    </style>
  </head>
  <body>
    <label for="message">Message</label>
    <textarea id="message" placeholder="Hello chat!"></textarea>
    <script>
      let websocket = null;
      let actionInfo = null;
      let settings = {};

      function connectElgatoStreamDeckSocket(port, pluginUuid, registerEvent, info, actionInfoRaw) {
        actionInfo = JSON.parse(actionInfoRaw);
        settings = actionInfo.payload?.settings || {};
        document.getElementById("message").value = settings.message || "";
        websocket = new WebSocket("ws://127.0.0.1:" + port);
        websocket.onopen = function () {
          websocket.send(JSON.stringify({ event: registerEvent, uuid: pluginUuid }));
        };
      }

      function save() {
        settings = { message: document.getElementById("message").value };
        websocket.send(
          JSON.stringify({
            event: "setSettings",
            context: actionInfo.context,
            payload: settings,
          }),
        );
      }

      document.getElementById("message").addEventListener("change", save);
      document.getElementById("message").addEventListener("blur", save);
      window.connectElgatoStreamDeckSocket = connectElgatoStreamDeckSocket;
    </script>
  </body>
</html>
